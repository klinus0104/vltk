services:
  mysql57:
    image: mysql:5.7
    container_name: jx1_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: "1234560123"
    volumes:
      - ./dockerdata/mysql_server1/data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p1234560123 --silent"]
      interval: 5s
      timeout: 3s
      retries: 36
      start_period: 20s

  mssql:
    image: mcr.microsoft.com/mssql/server:2019-latest
    container_name: jx1_mssql
    restart: always
    environment:
      SA_PASSWORD: "SAJx123456"
      ACCEPT_EULA: "Y"
      TZ: "Asia/Ho_Chi_Minh"
    volumes:
      - ./dockerdata/mssql_account_tong/data:/var/opt/mssql/data
      - ./dockerdata/mssql_account_tong/mssql.conf:/var/opt/mssql/mssql.conf:ro
      - ./dbbackup:/home/database_backups:ro
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U SA -P SAJx123456 -C -Q 'SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 36
      start_period: 20s
